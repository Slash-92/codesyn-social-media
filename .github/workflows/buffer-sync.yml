name: Buffer sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

concurrency:
  group: buffer-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create drafts and fill free Buffer slots
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: node automation/buffer-sync.mjs
      - name: Save Buffer state
        run: |
          if [ -z "$(git status --porcelain -- automation/buffer-state.json)" ]; then
            exit 0
          fi
          git config user.name "codesyn-buffer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/buffer-state.json
          git commit -m "Update Buffer publishing state"
          git push
